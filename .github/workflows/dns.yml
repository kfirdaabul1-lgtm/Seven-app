name: HTTPS check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dns.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          D=app.sevencollection.co.il
          for i in $(seq 1 50); do if curl -s -o /dev/null --max-time 15 https://$D/; then echo "::notice title=HTTPS OK::after $i tries $(date -u +%H:%M) · $(curl -sI https://$D/ | head -1)"; exit 0; fi; sleep 30; done
          echo "::notice title=HTTPS not yet::$(date -u +%H:%M)"
