name: HTTPS check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dns.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          D=app.sevencollection.co.il
          echo "::notice title=config::$(curl -s https://$D/config.js | grep -o 'appUrl: "[^"]*"\|domain: "[^"]*"' | tr '\n' ' ')"
          echo "::notice title=pages::index $(curl -s -o /dev/null -w '%{http_code}' https://$D/) events $(curl -s -o /dev/null -w '%{http_code}' https://$D/events.html) spa $(curl -s -o /dev/null -w '%{http_code}' https://$D/spa.html) sw $(curl -s -o /dev/null -w '%{http_code}' https://$D/firebase-messaging-sw.js)"
