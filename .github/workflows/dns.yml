name: DNS check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dns.yml']
  workflow_dispatch:
jobs:
  dig:
    runs-on: ubuntu-latest
    steps:
      - run: |
          D=app.sevencollection.co.il
          echo "::notice title=auth park1::$(dig +short $D CNAME @park1.livedns.co.il) | park2: $(dig +short $D CNAME @park2.livedns.co.il) | any: $(dig +short $D ANY @park1.livedns.co.il | tr '\n' ' ')"
          echo "::notice title=google::$(dig +short $D CNAME @8.8.8.8) | cf: $(dig +short $D CNAME @1.1.1.1) | NS: $(dig +short NS sevencollection.co.il @8.8.8.8 | tr '\n' ' ')"
          echo "::notice title=http::$(curl -sI --max-time 15 http://$D/ | head -3 | tr '\r\n' '  ')"
