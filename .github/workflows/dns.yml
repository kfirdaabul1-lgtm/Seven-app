name: HTTPS check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dns.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://app.sevencollection.co.il/index.html https://kfirdaabul1-lgtm.github.io/shifts/index.html; do echo "::notice title=$u::pwInfoHTML=$(curl -s $u | grep -c 'function pwInfoHTML') age=$(curl -sI $u | grep -i '^age\|^last-modified' | tr '\r\n' '  ')"; done
