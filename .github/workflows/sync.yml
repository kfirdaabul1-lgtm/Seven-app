name: Sync from shifts
# A copy of the public site kfirdaabul1-lgtm/shifts served at app.sevencollection.co.il (Seven Collection only).
# Every 5 minutes (and on demand) it copies the site files to the gh-pages branch when shifts changed.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Get shifts
        run: git clone --depth 1 https://github.com/kfirdaabul1-lgtm/shifts.git src
      - name: Get gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" site 2>/dev/null || { mkdir site && cd site && git init -q -b gh-pages && git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"; }
      - name: Copy site files
        run: |
          SHA=$(git -C src rev-parse --short HEAD)
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='functions' --exclude='CLAUDE.md' --exclude='firestore.rules' --exclude='firebase.json' --exclude='CNAME' src/ site/
          echo "app.sevencollection.co.il" > site/CNAME
          touch site/.nojekyll
          cd site
          git config user.name "seven-app sync"; git config user.email "sync@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no change"; else git commit -qm "sync shifts $SHA" && git push -q origin gh-pages && echo "::notice title=Synced::shifts $SHA"; fi
